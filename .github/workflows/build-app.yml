name: Build application

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Deterministic and policy tests (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        # The Linux-only licensing and import-bootstrap suites load the build tooling.
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run deterministic and policy suites
        run: python tests/run_suites.py --role deterministic --role policy

  windows-deterministic-tests:
    name: Deterministic and policy tests (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic and policy suites
        shell: pwsh
        run: |
          python tests/run_suites.py --role deterministic --role policy 2>&1 | Tee-Object -FilePath windows-test-suites.log
          $testExitCode = $LASTEXITCODE
          exit $testExitCode

      - name: Check strict Windows console encoding
        shell: pwsh
        run: |
          python -c "import sys; from sdctoolbox.model import AlertSignalLocation, SignalInfo; sys.stdout.reconfigure(encoding='cp1252', errors='strict'); print(SignalInfo('signal', 'Vis', 'On', AlertSignalLocation.REMOTE, True).summary())" 2>&1 | Tee-Object -FilePath windows-console-encoding.log
          $testExitCode = $LASTEXITCODE
          exit $testExitCode

      - name: Publish Windows test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-deterministic-output
          path: |
            windows-test-suites.log
            windows-console-encoding.log
          if-no-files-found: warn

  network-acceptance:
    name: Network acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated provider/consumer acceptance
        run: |
          set -o pipefail
          python tests/acceptance_core.py 2>&1 | tee network-acceptance.log

      - name: Publish provider and consumer output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-acceptance-output
          path: network-acceptance.log
          if-no-files-found: warn

  tls-acceptance:
    name: TLS acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run TLS provider/consumer acceptance
        run: |
          set -o pipefail
          python tests/tls_acceptance.py 2>&1 | tee tls-acceptance.log

      - name: Publish TLS acceptance output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-acceptance-output
          path: tls-acceptance.log
          if-no-files-found: warn

  network-regressions:
    name: Network regression (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: ["passive-discovery", "operation-subscription", "connection-loss", "mdib-network"]
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime library
        if: matrix.suite == 'connection-loss' || matrix.suite == 'mdib-network'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated network regression
        run: |
          set -o pipefail
          python tests/run_suites.py ${{ matrix.suite }} 2>&1 | tee ${{ matrix.suite }}.log

      - name: Publish network regression output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-output
          path: ${{ matrix.suite }}.log
          if-no-files-found: warn

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows executable
            os: windows-2022
          - name: Linux bundle
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          binutils libbrotli1 libdbus-1-3 libegl1 libfontconfig1 libfreetype6
          libgl1 libglib2.0-0 libgtk-3-0 libx11-xcb1 libxcb-cursor0
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0
          libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
          libxkbcommon0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build application
        timeout-minutes: 15
        run: pyinstaller --clean --noconfirm SDC-Testing-Toolbox.spec

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Remove-Item smoke-test-error.txt -ErrorAction SilentlyContinue
          .\dist\SDC-Testing-Toolbox\SDC-Testing-Toolbox.exe --name packaged-smoke --ip 127.0.0.1 --smoke-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path smoke-test-error.txt) { Get-Content smoke-test-error.txt }
            exit $LASTEXITCODE
          }

      - name: Smoke-test Linux bundle
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/SDC-Testing-Toolbox/SDC-Testing-Toolbox --name packaged-smoke --ip 127.0.0.1 --smoke-test

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SDC-Testing-Toolbox -DestinationPath dist/SDC-Testing-Toolbox-windows-x86_64.zip

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/SDC-Testing-Toolbox-linux-x86_64.tar.gz SDC-Testing-Toolbox

      - name: Build Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python packaging/linux/build_packages.py --release ${{ github.run_number }}

      - name: Open final artifact and validate legal payload
        shell: pwsh
        run: |
          $artifacts = if ($IsWindows) {
            @("dist/SDC-Testing-Toolbox-windows-x86_64.zip")
          } else {
            @("dist/SDC-Testing-Toolbox-linux-x86_64.tar.gz") +
              @(Get-ChildItem dist/*.deb, dist/*.rpm, dist/*.AppImage | ForEach-Object FullName)
          }
          foreach ($artifact in $artifacts) {
            python tests/licensing.py --artifact $artifact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDC-Testing-Toolbox-windows-x86_64
          path: dist/SDC-Testing-Toolbox-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDC-Testing-Toolbox-linux-x86_64
          path: dist/SDC-Testing-Toolbox-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDC-Testing-Toolbox-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  inspect-artifacts:
    name: Inspect Windows and Linux legal payloads
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SDC-Testing-Toolbox-windows-x86_64
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SDC-Testing-Toolbox-linux-x86_64
          path: artifacts/linux

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SDC-Testing-Toolbox-linux-packages
          path: artifacts/packages

      - name: Open both uploaded artifacts and validate legal payloads
        run: |
          python tests/licensing.py --artifact artifacts/windows/SDC-Testing-Toolbox-windows-x86_64.zip
          python tests/licensing.py --artifact artifacts/linux/SDC-Testing-Toolbox-linux-x86_64.tar.gz

      - name: Open the uploaded Linux packages and validate legal payloads
        run: |
          set -e
          for package in artifacts/packages/*.deb artifacts/packages/*.rpm artifacts/packages/*.AppImage; do
            python tests/licensing.py --artifact "$package"
          done

  install-packages:
    name: Install ${{ matrix.kind }} on ${{ matrix.image }}
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "fedora:latest", kind: rpm }
          - { image: "opensuse/tumbleweed", kind: rpm }
          - { image: "almalinux:10", kind: rpm }
          - { image: "ubuntu:22.04", kind: appimage }
          - { image: "ubuntu:24.04", kind: appimage }
          - { image: "debian:12", kind: appimage }
          - { image: "fedora:latest", kind: appimage }
          - { image: "opensuse/tumbleweed", kind: appimage }
          - { image: "almalinux:10", kind: appimage }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SDC-Testing-Toolbox-linux-packages
          path: artifacts/packages

      - name: Install, smoke-test and remove the package
        run: sh packaging/linux/install_test.sh artifacts/packages/*.${{ matrix.kind == 'appimage' && 'AppImage' || matrix.kind }}
