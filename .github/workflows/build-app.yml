name: Build application

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API compatibility
            script: diagnostics/check_api.py
          - name: Diagnostic behavior
            script: tests/diagnostic_behavior.py
          - name: Application defaults
            script: tests/application_defaults.py
          - name: Licensing and notices
            script: tests/licensing.py
          - name: Provider core
            script: tests/provider_core.py
          - name: Presets
            script: tests/presets.py
          - name: Config round trip
            script: tests/config_roundtrip.py
          - name: Widget controls
            script: tests/widget_controls.py
          - name: GUI dialogs
            script: tests/gui_dialogs.py
          - name: GUI cards and plots
            script: tests/gui_cards_plots.py
          - name: GUI layout
            script: tests/gui_layout.py
          - name: Service lifecycle
            script: tests/service_lifecycle.py
          - name: Consumer window lifecycle
            script: tests/consumer_lifecycle.py
          - name: Acceptance readiness timeout
            script: tests/acceptance_readiness.py
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ${{ matrix.name }}
        run: python ${{ matrix.script }}

  network-acceptance:
    name: Network acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated provider/consumer acceptance
        run: |
          set -o pipefail
          python tests/acceptance_core.py 2>&1 | tee network-acceptance.log

      - name: Publish provider and consumer output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-acceptance-output
          path: network-acceptance.log
          if-no-files-found: warn

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows executable
            os: windows-2022
          - name: Linux bundle
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          binutils libbrotli1 libdbus-1-3 libegl1 libfontconfig1 libfreetype6
          libgl1 libglib2.0-0 libgtk-3-0 libx11-xcb1 libxcb-cursor0
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0
          libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
          libxkbcommon0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build application
        timeout-minutes: 15
        run: pyinstaller --clean --noconfirm SDC-Testing-Toolbox.spec

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Remove-Item smoke-test-error.txt -ErrorAction SilentlyContinue
          .\dist\SDC-Testing-Toolbox.exe --name packaged-smoke --ip 127.0.0.1 --smoke-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path smoke-test-error.txt) { Get-Content smoke-test-error.txt }
            exit $LASTEXITCODE
          }

      - name: Smoke-test Linux bundle
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/SDC-Testing-Toolbox/SDC-Testing-Toolbox --name packaged-smoke --ip 127.0.0.1 --smoke-test

      - name: Stage Windows legal notices
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist

      - name: Verify packaged legal notices
        shell: pwsh
        run: |
          $bundle = if ($IsWindows) { "dist" } else { "dist/SDC-Testing-Toolbox" }
          if (-not (Test-Path "$bundle/LICENSE") -or
              -not (Test-Path "$bundle/THIRD_PARTY_NOTICES.md")) {
            throw "Packaged legal notices are missing from $bundle"
          }

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/SDC-Testing-Toolbox-linux-x86_64.tar.gz SDC-Testing-Toolbox

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SDC-Testing-Toolbox-windows-x86_64
          path: |
            dist/SDC-Testing-Toolbox.exe
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SDC-Testing-Toolbox-linux-x86_64
          path: dist/SDC-Testing-Toolbox-linux-x86_64.tar.gz
          if-no-files-found: error
