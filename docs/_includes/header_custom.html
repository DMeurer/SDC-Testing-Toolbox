<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<script>
  (function () {
    var button = document.getElementById("theme-toggle");
    function isDark() { return jtd.getTheme() === "dark"; }
    function show() {
      var dark = isDark();
      button.querySelector(".icon-moon").style.display = dark ? "none" : "";
      button.querySelector(".icon-sun").style.display = dark ? "" : "none";
      var label = dark ? "Switch to light mode" : "Switch to dark mode";
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    }
    button.addEventListener("click", function () {
      var dark = !isDark();
      jtd.setTheme(dark ? "toolbox-dark" : "default");
      try { localStorage.setItem("toolbox-theme", dark ? "dark" : "light"); } catch (e) {}
      show();
      // Diagrams are drawn once, in the colours of the mode the page opened in.
      if (document.querySelector(".language-mermaid")) { location.reload(); }
    });
    show();
  })();
</script>
